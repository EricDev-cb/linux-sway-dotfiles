# include ~/.local/state/hakuspace/theme/kitty-style.conf
allow_remote_control yes
listen_on unix:/tmp/kitty

# FONT
#font_family already defined in kitty-style.conf
#font_size already defined in kitty-style.conf
bold_font        auto
italic_font      auto
bold_italic_font auto

# COLOR SCHEME — Ayu Dark

# Background and foreground
background #0b0e14
foreground #bfbdb6

# Cursor
cursor #e6b450
cursor_text_color #0b0e14

# Selection
selection_background #273747
selection_foreground #bfbdb6

# Black
color0  #01060e
color8  #686868

# Red
color1  #ea6c73
color9  #f07178

# Green
color2  #91b362
color10 #c2d94c

# Yellow
color3  #f9af4f
color11 #ffb454

# Blue
color4  #53bdfa
color12 #59c2ff

# Magenta
color5  #fae994
color13 #ffee99

# Cyan
color6  #90e1c6
color14 #95e6cb

# White
color7  #c7c7c7
color15 #ffffff

# Window borders
active_border_color   #e6b450
inactive_border_color #1c2433
# White already defined in kitty-style.conf

# CONFIGURATION
# background_opacity 0.9
window_margin_width 20
confirm_os_window_close 0

cursor_shape beam
cursor_shape_unfocused block
cursor_blink_interval 1
mouse_hide_wait 3.0
cursor_trail 2
cursor_trail_decay 0.1 0.4

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

scrollback_lines 5000
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd

# Include opaque theme config feature
# include ~/.local/state/hakuspace/theme/opaque/kitty.conf

# Include custom config from hakucfg
# include ~/hakucfg/config/kitty.conf
